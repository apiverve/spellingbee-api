[project]
name = "apiverve-spellingbeegenerator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Spelling Bee Generator creates word puzzles with 7 letters where players form words using a required center letter."
keywords = ["spelling bee api", "spelling bee generator", "spelling bee json", "spelling bee puzzle generator", "word puzzle"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/spellingbee?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/spellingbee?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/spellingbee-api"
Twitter = "https://twitter.com/apivervehq"
